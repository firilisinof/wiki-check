[package]
name = "wiki-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP service for a personal Markdown wiki kept in Git"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ureq = { version = "3", default-features = false, features = ["gzip", "platform-verifier", "rustls-no-provider"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
